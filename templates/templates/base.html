<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BerryLens AI{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            line-height: 1.5;
        }
        .navbar {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #58a6ff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: #58a6ff; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #30363d; }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: #2ea043; transform: translateY(-1px); }
        .btn-secondary {
            background: #1f6feb;
            text-decoration: none;
            display: inline-block;
        }
        .btn-secondary:hover { background: #388bfd; }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.875rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .flash {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .flash.error { background: rgba(255, 123, 114, 0.1); color: #ff7b72; border: 1px solid rgba(255, 123, 114, 0.3); }
        .flash.success { background: rgba(63, 185, 80, 0.1); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
        .verdict-supported { color: #3fb950; }
        .verdict-refuted { color: #ff7b72; }
        .verdict-insufficient { color: #d29922; }
        .verdict-misleading { color: #a371f7; }
        .verdict-unverifiable { color: #8b949e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.875rem; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover td { background: rgba(48, 54, 61, 0.3); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #58a6ff;
            line-height: 1;
        }
        .stat-label {
            color: #8b949e;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
        .tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .tag-pending { background: rgba(210, 153, 34, 0.15); color: #d29922; }
        .tag-completed { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .tag-failed { background: rgba(255, 123, 114, 0.15); color: #ff7b72; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="navbar-brand">BerryLens AI</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Verify</a>
            <a href="{{ url_for('history') }}">History</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
