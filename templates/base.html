<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BerryLens AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0c12; --panel:rgba(24,25,38,.78); --line:rgba(255,255,255,.1); --text:#f6f4ff; --muted:#9a98ad; --violet:#9b7bff; --cyan:#45d5df; --green:#43d49a; --red:#ff7181; --amber:#f7bd55; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); font:15px/1.6 'DM Sans',sans-serif; background:radial-gradient(circle at 12% 8%,#221c43 0,transparent 32%),radial-gradient(circle at 90% 80%,#103b44 0,transparent 28%),var(--bg); }
    body:before { content:''; position:fixed; inset:0; pointer-events:none; opacity:.18; background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px); background-size:48px 48px; mask-image:linear-gradient(to bottom,black,transparent 85%); }
    nav { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1rem clamp(1rem,4vw,4rem); background:rgba(11,12,18,.8); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
    .brand { color:var(--text); text-decoration:none; font-weight:700; font-size:1.15rem; } .brand b { color:var(--violet); } .nav-links { display:flex; gap:1.25rem; } .nav-links a { color:var(--muted); text-decoration:none; } .nav-links a:hover { color:var(--text); }
    main { position:relative; z-index:1; width:min(1100px,calc(100% - 2rem)); margin:auto; padding:3rem 0 5rem; } .card { padding:1.5rem; margin-bottom:1.25rem; border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(14px); box-shadow:0 18px 60px rgba(0,0,0,.2); } h1,h2,h3 { line-height:1.15; } h1 { font-size:clamp(2.3rem,6vw,4.8rem); margin:.5rem 0 1rem; } h2 { margin-top:0; } .muted { color:var(--muted); } .mono { font-family:'JetBrains Mono',monospace; } .accent { color:var(--violet); } .cyan { color:var(--cyan); }
    textarea,input { width:100%; color:var(--text); background:rgba(0,0,0,.2); border:1px solid var(--line); border-radius:10px; padding:1rem; font:inherit; } textarea:focus,input:focus { outline:2px solid rgba(155,123,255,.5); border-color:var(--violet); } button,.button { display:inline-block; color:white; background:linear-gradient(120deg,var(--violet),#4dbdd5); border:0; border-radius:10px; padding:.85rem 1.2rem; font-weight:700; cursor:pointer; text-decoration:none; } .button.secondary { background:rgba(255,255,255,.08); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; } .stat strong { display:block; font:700 2rem 'JetBrains Mono',monospace; } .stat small { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:.8rem .5rem; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:.75rem; text-transform:uppercase; } .tag { color:var(--cyan); font:500 .78rem 'JetBrains Mono',monospace; } .flash { padding:1rem; margin-bottom:1rem; border:1px solid var(--red); color:var(--red); border-radius:10px; }
    @media (max-width:650px) { nav { align-items:flex-start; flex-direction:column; } .nav-links { gap:.8rem; font-size:.9rem; } main { padding-top:2rem; } table { font-size:.85rem; } }
  </style>
</head>
<body>
<nav><a class="brand" href="{{ url_for('home') }}">BerryLens <b>AI</b></a><div class="nav-links"><a href="{{ url_for('home') }}">Check</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('dashboard') }}">Dashboard</a></div></nav>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body></html>
